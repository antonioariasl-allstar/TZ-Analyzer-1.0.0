name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CPython 3.12.8 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          architecture: 'x64'

      - name: Install release test environment
        run: |
          python -c "import platform, struct, sys, sysconfig; assert platform.python_implementation() == 'CPython' and sys.version_info[:3] == (3, 12, 8) and struct.calcsize('P') * 8 == 64 and sysconfig.get_platform() == 'win-amd64'"
          python -m pip install --upgrade pip==24.3.1
          python -m pip install -r requirements-test.txt
          python -m pip check

      - name: Run tests
        run: |
          $env:PYTHONPATH = "$PWD;$env:PYTHONPATH"
          python -m pytest -q

      - name: Install non-blocking static analysis tools
        continue-on-error: true
        run: |
          python -m pip install flake8 mypy vulture radon bandit

      - name: Static analysis (flake8)
        continue-on-error: true
        run: |
          mkdir reports
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || exit 0
          flake8 . --count --exit-zero --max-complexity=30 --max-line-length=120 --statistics || exit 0

      - name: Static analysis (mypy)
        continue-on-error: true
        run: |
          mypy . --install-types --non-interactive || exit 0

      - name: Dead code scan (vulture)
        continue-on-error: true
        run: |
          vulture . --min-confidence 60 > reports/vulture.txt || exit 0

      - name: Complexity report (radon)
        continue-on-error: true
        run: |
          radon cc -s -a . > reports/radon_cc.txt || exit 0
          radon mi . > reports/radon_mi.txt || exit 0

      - name: Security scan (bandit)
        continue-on-error: true
        run: |
          bandit -r -q . -f txt -o reports/bandit.txt || exit 0

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: reports
